name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14   # Apple Silicon (arm64). For Intel support add macos-13 to a matrix.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release.sh needs the triggering tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AstroPaperDigest/requirements.txt
          pip install pyinstaller

      - name: Build release artifacts (app + dmg + source/app zips + version.json)
        working-directory: AstroPaperDigest
        run: ./release.sh

      - name: Generate release notes with SHA-256 checksums
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          git tag -l --format='%(contents)' "$TAG" > /tmp/release-body.md
          {
            echo ""
            echo "## Checksums (SHA-256)"
            # .app.zip FIRST: the in-app updater verifies against the first
            # SHA-256 it finds in the release body.
            for f in AstroPaperDigest/dist/AstroPaperDigest-v*.app.zip \
                     AstroPaperDigest/dist/AstroPaperDigest-*.dmg \
                     AstroPaperDigest/dist/AstroPaperDigest-v*.source.zip; do
              echo "- $(basename "$f")"
              echo "  SHA256: $(shasum -a 256 "$f" | awk '{print $1}')"
            done
          } >> /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          files: |
            AstroPaperDigest/dist/AstroPaperDigest-*.dmg
            AstroPaperDigest/dist/AstroPaperDigest-v*.app.zip
            AstroPaperDigest/dist/AstroPaperDigest-v*.source.zip
            AstroPaperDigest/dist/version.json
            AstroPaperDigest/dist/SHA256SUMS