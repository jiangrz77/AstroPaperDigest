name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14   # Apple Silicon (arm64). For Intel support add macos-13 to a matrix.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release.sh needs the triggering tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # OpenSSL 3.x (LibreSSL-free TLS)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AstroPaperDigest/requirements.txt
          pip install pyinstaller

      - name: Build release artifacts (app + dmg + source/app zips + version.json)
        working-directory: AstroPaperDigest
        run: ./release.sh

      - name: Generate release notes with SHA-256 checksums
        run: |
          # Read the annotated tag message via the GitHub API (robust on any
          # runner; git tag -l %(contents) behaved differently in CI).
          if REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha' 2>/dev/null)"; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$REF_SHA" --jq '.message' > /tmp/release-body.md
          else
            # lightweight tag or API hiccup: fall back to the tag name
            echo "$GITHUB_REF_NAME" > /tmp/release-body.md
          fi
          {
            echo ""
            echo "## Checksums (SHA-256)"
            for f in AstroPaperDigest/dist/AstroPaperDigest-*.dmg; do
              echo "- $(basename "$f")"
              echo "  SHA256: $(shasum -a 256 "$f" | awk '{print $1}')"
            done
          } >> /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          # dmg-only release (in-app whole-bundle updates are not shipped yet)
          files: |
            AstroPaperDigest/dist/AstroPaperDigest-*.dmg