llm:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-flash-vision-exp
output:
  bibtex_dir: ./output/bibtex
  digest_dir: ./output/digests
email:
  enabled: false
  smtp_server: mail.cstnet.cn
  smtp_port: 465
  use_ssl: true
  sender: rzjiang@pmo.ac.cn
  recipient: rzjiang@pmo.ac.cn
  password_env: EMAIL_APP_PASSWORD
filter:
  max_candidates_for_llm: 100
  score_threshold: 7
timezone:
  digest: Asia/Shanghai
  available_after: '10:01'
